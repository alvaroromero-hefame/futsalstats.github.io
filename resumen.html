<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Resumen de Temporada · Futsal Stats</title>
	<meta name="description" content="Los mejores jugadores de la temporada de fútbol sala">

	<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-96x96.png">

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">

	<link rel="stylesheet" href="css/main.css">
	<link rel="stylesheet" href="css/tables.css">
	<link rel="stylesheet" href="css/resumen.css">
</head>
<body class="resumen-body" data-active-day="martes">

<!-- Iconos SVG reutilizables -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
	<defs>
		<symbol id="i-trofeo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="6"/><path d="M15.5 12.9 17 22l-5-3-5 3 1.5-9.1"/></symbol>
		<symbol id="i-estrella" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 3.1 6.3 6.9 1-5 4.9 1.2 6.8L12 17.8l-6.2 3.2L7 14.2l-5-4.9 6.9-1z"/></symbol>
		<symbol id="i-balon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m12 7 4 3-1.5 5h-5L8 10z"/><path d="M12 7V4M8.5 10 5 8M15.5 10 19 8M9.5 15l-2 3.5M14.5 15l2 3.5"/></symbol>
		<symbol id="i-diana" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></symbol>
		<symbol id="i-escudo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 4 5v6c0 5.2 3.4 9.2 8 11 4.6-1.8 8-5.8 8-11V5z"/></symbol>
		<symbol id="i-actividad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
		<symbol id="i-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.9 2.6 11.4 6c.1.2.3.4.5.5l3.4 1.5a1 1 0 0 1 0 1.8L12 11.4a1 1 0 0 0-.6.6l-1.5 3.4a1 1 0 0 1-1.8 0L6.6 12a1 1 0 0 0-.5-.5L2.6 10a1 1 0 0 1 0-1.8L6 6.6c.2-.1.4-.3.5-.5l1.6-3.5a1 1 0 0 1 1.8 0Z"/></symbol>
	</defs>
</svg>

<!-- HERO -->
<div class="resumen-hero pitch-lines">
	<span class="resumen-eyebrow" id="season-eyebrow">Temporada</span>
	<h1 class="resumen-title">LA TEMPORADA<br>HA ACABADO</h1>
	<p class="resumen-lead">Estos son los mejores jugadores de la temporada. ¡Hasta la próxima!</p>
</div>

<!-- Selector de día (solo móvil) -->
<div class="day-selector-wrap">
	<div class="day-selector">
		<button type="button" class="active" data-day="martes">Martes</button>
		<button type="button" data-day="jueves">Jueves</button>
	</div>
</div>

<!-- CONTENT -->
<div id="app-root">
	<div class="state-msg" id="loading-msg">
		<p>Cargando estadísticas…</p>
	</div>
</div>

<div class="page-footer" id="page-footer" style="display:none">
	<strong>Futsal Stats</strong> · Resumen de Temporada
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

// ── Config ──────────────────────────────────────────────────
const SUPABASE_URL  = 'https://nqqbeuweyxatsxjsepnj.supabase.co';
const SUPABASE_KEY  = 'sb_publishable_lo3mmXzOCwyfYg2NnMBS3Q_v2eCoVpO';
const MIN_GAMES_PORTERO = 3; // mínimo partidos para aparecer en top porteros

// ── Supabase client ──────────────────────────────────────────
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Load all seasons (both days) ──────────────────────────────
async function loadSeasons() {
	const { data, error } = await supabase
		.from('seasons')
		.select('*')
		.order('start_date', { ascending: false });
	if (error) throw error;
	return data || [];
}

// ── Load matches for a day, opcionalmente filtrados por temporada ──
async function loadMatches(day, seasonId) {
	let query = supabase
		.from('matches')
		.select('*')
		.eq('day', day);
	if (seasonId) query = query.eq('season_id', seasonId);
	const { data, error } = await query.order('match_date', { ascending: true });
	if (error) throw error;
	return data || [];
}

// ── Load fixed players (titulares) for a day, opcionalmente por temporada ──
async function loadFijos(day, seasonId) {
	let query = supabase
		.from('player_availability')
		.select('players(name)')
		.eq('day', day)
		.eq('is_fixed', true);
	if (seasonId) query = query.eq('season_id', seasonId);
	const { data, error } = await query;
	if (error) throw error;
	return new Set((data || []).map(r => r.players?.name).filter(Boolean));
}

// ── Build player stats from raw matches ─────────────────────
function buildStats(matches) {
	const players = {};

	const ensure = (name) => {
		if (!players[name]) {
			players[name] = {
				nombre: name, puntos: 0, goles: 0, asistencias: 0,
				encajados: 0, ganados: 0, empatados: 0, perdidos: 0, mvps: 0
			};
		}
		return players[name];
	};

	matches.forEach(match => {
		const blue = match.blue_lineup || [];
		const red  = match.red_lineup  || [];

		let ptBlue = 0, ptRed = 0, resBlue = '', resRed = '';
		if (match.result === 'VictoryBlue') { ptBlue = 3; resBlue = 'G'; resRed  = 'P'; }
		else if (match.result === 'VictoryRed')  { ptRed  = 3; resBlue = 'P'; resRed  = 'G'; }
		else if (match.result === 'Draw')         { ptBlue = 1; ptRed = 1; resBlue = 'E'; resRed = 'E'; }

		// MVP
		if (match.mvp && match.mvp.trim() && match.mvp.trim() !== '-') {
			ensure(match.mvp.trim()).mvps++;
		}

		// Encajados totales por equipo (para penalización)
		const encBlue = blue.reduce((s, m) => s + (m.keeper ?? m.portero ?? 0), 0);
		const encRed  = red.reduce( (s, m) => s + (m.keeper ?? m.portero ?? 0), 0);

		const process = (lineup, pts, res, encEquipo) => {
			lineup.forEach(m => {
				const p = ensure(m.name);
				p.puntos += pts;
				const g = m.goal  ?? m.goles      ?? 0;
				const a = m.assist ?? m.asistencias ?? 0;
				const k = m.keeper ?? m.portero     ?? 0;
				p.puntos      += g * 0.25 + a * 0.25 + encEquipo * -0.10;
				p.goles       += g;
				p.asistencias += a;
				p.encajados   += k;
				if (res === 'G') p.ganados++;
				if (res === 'E') p.empatados++;
				if (res === 'P') p.perdidos++;
			});
		};

		process(blue, ptBlue, resBlue, encBlue);
		process(red,  ptRed,  resRed,  encRed);
	});

	// +1 punto por MVP
	Object.values(players).forEach(p => { p.puntos += p.mvps; });

	return Object.values(players).map(p => {
		const partidos = p.ganados + p.empatados + p.perdidos;
		return {
			...p,
			partidos,
			ratioEncajados: partidos > 0
				? +(p.encajados / partidos).toFixed(2)
				: 999
		};
	});
}

// ── Render helpers ────────────────────────────────────────────
function escHtml(str) {
	return String(str)
		.replace(/&/g, '&amp;')
		.replace(/</g, '&lt;')
		.replace(/>/g, '&gt;')
		.replace(/"/g, '&quot;');
}

function icon(id) {
	return `<svg class="icon"><use href="#${id}"/></svg>`;
}

function renderPodium(players, statFn, statLabel, rawFn, asc) {
	if (!players.length) return `<p class="no-data">Sin datos suficientes</p>`;

	const top = rawFn(players[0]);
	const worst = rawFn(players[players.length - 1]);

	return players.map((p, i) => {
		let pct;
		if (asc) {
			const span = top - worst;
			pct = span > 0 ? ((top - rawFn(p)) / span) * 100 : 100;
		} else {
			pct = top > 0 ? (rawFn(p) / top) * 100 : 100;
		}
		return `
			<div class="podium-row rank-${i + 1}">
				<span class="rank-badge">${String(i + 1).padStart(2, '0')}</span>
				<div class="podium-main">
					<span class="player-name">${escHtml(p.nombre)}</span>
					<div class="stat-bar-track"><div class="stat-bar-fill" style="--pct:${pct.toFixed(0)}%"></div></div>
				</div>
				<span class="stat-pill">${statFn(p)} ${statLabel}</span>
			</div>`;
	}).join('');
}

// ── Render titulares top3 + mejor suplente ───────────────────
function renderBlock(stats, fijos, { filterFn = () => true, sortFn, statFn, statLabel, asc = false }) {
	const sorted = (arr) => [...arr].sort((a, b) => asc ? sortFn(a) - sortFn(b) : sortFn(b) - sortFn(a));

	const titulares = sorted(stats.filter(p => fijos.has(p.nombre) && filterFn(p))).slice(0, 3);
	const suplentes = sorted(stats.filter(p => !fijos.has(p.nombre) && filterFn(p)));
	const bestSup   = suplentes[0] || null;

	let html = renderPodium(titulares, statFn, statLabel, sortFn, asc);

	if (bestSup) {
		html += `
			<div class="suplente-section">
				<div class="suplente-label">${icon('i-sparkle')} Mejor suplente</div>
				<div class="podium-row suplente-row">
					<span class="suplente-badge">${icon('i-sparkle')}</span>
					<div class="podium-main"><span class="player-name">${escHtml(bestSup.nombre)}</span></div>
					<span class="stat-pill">${statFn(bestSup)} ${statLabel}</span>
				</div>
			</div>`;
	}

	return html;
}

function renderDayCol(dayClass, dayName, html) {
	return `
		<div class="day-col" data-day="${dayClass}">
			<div class="day-label ${dayClass}">
				<span class="day-dot"></span>${dayName}
			</div>
			${html}
		</div>`;
}

function renderCategory({ iconId, title, subtitle, martesHtml, juevesHtml }) {
	return `
		<div class="cat-card">
			<div class="cat-header">
				${icon(iconId)}
				<div>
					<div class="cat-title">${title}</div>
					<div class="cat-subtitle">${subtitle}</div>
				</div>
			</div>
			<div class="days-grid">
				${renderDayCol('martes', 'Martes', martesHtml)}
				${renderDayCol('jueves', 'Jueves', juevesHtml)}
			</div>
		</div>`;
}

// ── Temporada inmediatamente anterior a la activa (mismo nombre en martes y jueves) ──
let allSeasons = [];

function seasonIdFor(day, seasonName) {
	return allSeasons.find(s => s.day === day && s.name === seasonName)?.id || null;
}

// ── Main ──────────────────────────────────────────────────────
async function main() {
	try {
		allSeasons = await loadSeasons(); // ordenadas por start_date desc
		const activeName = allSeasons.find(s => s.is_active)?.name;
		const seasonName = allSeasons.find(s => s.name !== activeName)?.name;
		if (!seasonName) throw new Error('No hay temporada anterior');
		document.getElementById('season-eyebrow').textContent = `Temporada ${seasonName}`;

		const seasonIdMartes = seasonIdFor('martes', seasonName);
		const seasonIdJueves = seasonIdFor('jueves', seasonName);

		const [matchesMartes, matchesJueves, fijosMartes, fijosJueves] = await Promise.all([
			loadMatches('martes', seasonIdMartes),
			loadMatches('jueves', seasonIdJueves),
			loadFijos('martes', seasonIdMartes),
			loadFijos('jueves', seasonIdJueves)
		]);

		const statsM = buildStats(matchesMartes);
		const statsJ = buildStats(matchesJueves);

		const categories = [
			{
				iconId: 'i-trofeo',
				title: 'Líderes',
				subtitle: 'Jugadores con más puntos totales',
				fn: (stats, fijos) => renderBlock(stats, fijos, {
					sortFn: p => p.puntos,
					statFn: p => p.puntos.toFixed(1),
					statLabel: 'pts'
				})
			},
			{
				iconId: 'i-estrella',
				title: 'Top MVPs',
				subtitle: 'Jugadores más valiosos del partido',
				fn: (stats, fijos) => renderBlock(stats, fijos, {
					filterFn: p => p.mvps > 0,
					sortFn: p => p.mvps,
					statFn: p => p.mvps,
					statLabel: 'MVPs'
				})
			},
			{
				iconId: 'i-balon',
				title: 'Top Goleadores',
				subtitle: 'Jugadores con más goles',
				fn: (stats, fijos) => renderBlock(stats, fijos, {
					filterFn: p => p.goles > 0,
					sortFn: p => p.goles,
					statFn: p => p.goles,
					statLabel: 'goles'
				})
			},
			{
				iconId: 'i-diana',
				title: 'Top Asistentes',
				subtitle: 'Jugadores con más asistencias',
				fn: (stats, fijos) => renderBlock(stats, fijos, {
					filterFn: p => p.asistencias > 0,
					sortFn: p => p.asistencias,
					statFn: p => p.asistencias,
					statLabel: 'asist.'
				})
			},
			{
				iconId: 'i-escudo',
				title: 'Top Porteros',
				subtitle: `Menor ratio goles encajados/partido (mín. ${MIN_GAMES_PORTERO} partidos como portero)`,
				fn: (stats, fijos) => renderBlock(stats, fijos, {
					filterFn: p => p.encajados > 0 && p.partidos >= MIN_GAMES_PORTERO,
					sortFn: p => p.ratioEncajados,
					statFn: p => p.ratioEncajados.toFixed(2),
					statLabel: 'enc/ptdo',
					asc: true
				})
			},
			{
				iconId: 'i-actividad',
				title: 'Top Jugados',
				subtitle: 'Jugadores que más partidos han disputado',
				fn: (stats, fijos) => renderBlock(stats, fijos, {
					filterFn: p => p.partidos > 0,
					sortFn: p => p.partidos,
					statFn: p => p.partidos,
					statLabel: 'partidos'
				})
			}
		];

		const sectionsHtml = categories.map(cat => renderCategory({
			iconId: cat.iconId,
			title: cat.title,
			subtitle: cat.subtitle,
			martesHtml: cat.fn(statsM, fijosMartes),
			juevesHtml: cat.fn(statsJ, fijosJueves)
		})).join('');

		document.getElementById('app-root').innerHTML = `
			<div class="sections">${sectionsHtml}</div>`;
		document.getElementById('page-footer').style.display = '';

	} catch (err) {
		console.error('Error cargando datos:', err);
		document.getElementById('app-root').innerHTML = `
			<div class="state-msg">
				<p>Error al cargar los datos: ${escHtml(err.message)}</p>
			</div>`;
	}
}

// ── Selector de día (móvil) ──────────────────────────────────
document.querySelectorAll('.day-selector button').forEach(btn => {
	btn.addEventListener('click', () => {
		document.querySelectorAll('.day-selector button').forEach(b => b.classList.remove('active'));
		btn.classList.add('active');
		document.body.dataset.activeDay = btn.dataset.day;
	});
});

main();
</script>
</body>
</html>
