    <!-- Login Screen -->
    <div id="login-screen" class="login-screen">
        <div class="login-container">
            <div class="login-header">
                <span class="brand-mark">FS</span>
                <h1>Panel de Admin</h1>
                <p>Futsal Stats</p>
            </div>
            <form id="login-form" class="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required autocomplete="email" placeholder="admin@futsalstats.com">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <div id="login-error" class="error-message" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-block">
                    Iniciar Sesión
                </button>
            </form>
            <div class="login-footer">
                <a href="app.html">← Volver a la aplicación</a>
            </div>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-screen" class="admin-screen" style="display: none;">
        <!-- El contenido se cargará dinámicamente -->
    </div>

    <script type="module">
        // Usar versión específica estable del SDK de Supabase para admin
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.38.4';
        import { config } from './js/config.js';
        import { AuthManager } from './js/auth/authManager.js';
        import { AdminPanel } from './js/admin/panel.js';
        import { DataManager } from './js/dataManager.js';
        import { globalSessionTimeout } from './js/security/sessionTimeout.js';

        // Inicializar aplicación admin
        class AdminApp {
            constructor() {
                this.supabase = null;
                this.auth = null;
                this.panel = null;
                this.dataManager = null;
                this.sessionTimeout = null;
            }

            async init() {
                // Crear AuthManager (crea su propio cliente Supabase internamente)
                this.auth = new AuthManager();
                this.supabase = this.auth.supabase; // Reutilizar el cliente de AuthManager
                this.dataManager = new DataManager(this.supabase);

                // Inicializar AuthManager
                await this.auth.init();

                // Verificar parámetro logout
                const urlParams = new URLSearchParams(window.location.search);
                if (urlParams.get('logout') === 'true') {
                    await this.auth.logout();
                    window.location.href = 'admin.html';
                    return;
                }

                // Verificar sesión existente
                const authStatus = await this.auth.checkAuth();
                if (authStatus.authenticated) {
                    // Verificar que sea admin
                    const isAdmin = await this.auth.isAdmin();
                    if (isAdmin) {
                        this.showAdminPanel();
                    } else {
                        this.showError('No tienes permisos de administrador');
                        await this.auth.logout();
                        this.showLoginScreen();
                    }
                } else {
                    this.showLoginScreen();
                }

                // Escuchar cambios de autenticación
                this.auth.onAuthStateChange((event, session) => {
                    if (event === 'SIGNED_IN') {
                        // Verificar rol admin antes de mostrar panel
                        this.auth.isAdmin().then(isAdmin => {
                            if (isAdmin) {
                                this.showAdminPanel();
                            } else {
                                this.showError('No tienes permisos de administrador');
                                this.auth.logout();
                            }
                        });
                    } else if (event === 'SIGNED_OUT') {
                        this.showLoginScreen();
                    }
                });
            }

            showLoginScreen() {
                document.getElementById('login-screen').style.display = 'flex';
                document.getElementById('admin-screen').style.display = 'none';

                const loginForm = document.getElementById('login-form');
                loginForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    await this.handleLogin();
                });
            }

            async handleLogin() {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const errorDiv = document.getElementById('login-error');

                // Ocultar error previo
                errorDiv.style.display = 'none';

                // Mostrar loading
                const submitBtn = document.querySelector('#login-form button[type="submit"]');
                const originalText = submitBtn.textContent;
                submitBtn.textContent = 'Iniciando sesión...';
                submitBtn.disabled = true;

                const result = await this.auth.login(email, password);

                if (result.success) {
                    // El cambio de pantalla se manejará en onAuthStateChange
                } else {
                    errorDiv.textContent = result.error || 'Error al iniciar sesión';
                    errorDiv.style.display = 'block';
                    submitBtn.textContent = originalText;
                    submitBtn.disabled = false;
                }
            }

            async showAdminPanel() {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('admin-screen').style.display = 'block';

                // Iniciar Session Timeout
                if (!this.sessionTimeout) {
                    this.sessionTimeout = globalSessionTimeout;
                    this.sessionTimeout.onTimeout = async () => {
                        console.log('⏰ Sesión expirada - cerrando...');
                        await this.auth.logout();
                        this.sessionTimeout.showTimeoutMessage();
                        setTimeout(() => {
                            window.location.href = '/admin.html';
                        }, 2000);
                    };
                    this.sessionTimeout.start();
                    console.log('✅ Session timeout activado (15 minutos)');
                }

                // Crear y renderizar el panel solo la primera vez. Supabase dispara
                // SIGNED_IN/TOKEN_REFRESHED al recuperar el foco de la pestaña, y
                // volver a renderizar aquí reiniciaría la sección activa al inicio.
                if (!this.panel) {
                    this.panel = new AdminPanel(this.supabase, this.dataManager);
                    window.adminPanel = this.panel; // Para métodos onclick
                    const container = document.getElementById('admin-screen');
                    await this.panel.render(container);
                }
            }

            showError(message) {
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column;">
                        <h1>Error</h1>
                        <p>${message}</p>
                        <a href="index.html" class="btn btn-primary">Volver al inicio</a>
                    </div>
                `;
            }
        }

        // Iniciar app
        const app = new AdminApp();
        app.init();
    </script>
    
    <!-- Footer con versión -->
    <footer id="app-footer" class="app-footer">
        <p>
            <strong>Admin Panel - Futsal Stats</strong>
            <span id="app-version">v4.0.0</span>
            <span class="separator">·</span>
            <span>Panel de administración seguro</span>
        </p>
    </footer>

    <script>
        // Registrar Service Worker para PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js')
                .then(registration => {
                    console.log('✅ Service Worker registrado en admin');
                })
                .catch(error => {
                    console.error('❌ Error al registrar Service Worker:', error);
                });
        }
    </script>
