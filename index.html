	<!-- JavaScript modularizado con ES6 modules -->
	<script type="module" src="js/main.js"></script>

	<!-- PWA Service Worker Registration -->
	<script>
		// Registrar Service Worker para PWA
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('/sw.js')
					.then(registration => {
						console.log('✅ Service Worker registrado:', registration.scope);

						// Detectar actualizaciones del SW
						registration.addEventListener('updatefound', () => {
							const newWorker = registration.installing;
							newWorker.addEventListener('statechange', () => {
								if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
									// Hay una nueva versión disponible
									if (confirm('Hay una actualización disponible. ¿Recargar la página?')) {
										newWorker.postMessage({ type: 'SKIP_WAITING' });
										window.location.reload();
									}
								}
							});
						});
					})
					.catch(error => {
						console.error('❌ Error al registrar Service Worker:', error);
					});

				// Detectar cuando el SW toma control
				navigator.serviceWorker.addEventListener('controllerchange', () => {
					console.log('🔄 Service Worker actualizado, recargando...');
					window.location.reload();
				});
			});
		}

		// Detectar instalación de PWA
		let deferredPrompt;
		window.addEventListener('beforeinstallprompt', (e) => {
			// Prevenir el mini-infobar de Chrome
			e.preventDefault();
			deferredPrompt = e;

			// Mostrar botón de instalación personalizado (opcional)
			console.log('💡 PWA puede ser instalada');
			showInstallPromotion();
		});

		// Función para mostrar promoción de instalación
		function showInstallPromotion() {
			// Crear banner de instalación solo una vez
			if (localStorage.getItem('pwa-install-dismissed')) {
				return;
			}

			const banner = document.createElement('div');
			banner.id = 'install-banner';
			banner.style.cssText = `
				position: fixed;
				bottom: calc(76px + env(safe-area-inset-bottom));
				left: 50%;
				transform: translateX(-50%);
				background: var(--primary);
				color: var(--on-primary);
				padding: 14px 20px;
				border-radius: 12px;
				box-shadow: 0 8px 30px rgba(0,0,0,0.35);
				z-index: 10000;
				display: flex;
				align-items: center;
				gap: 15px;
				animation: slideUp 0.3s ease-out;
				max-width: 90%;
			`;

			banner.innerHTML = `
				<span>Instala Futsal Stats en tu dispositivo</span>
				<button id="install-button" style="
					background: var(--on-primary);
					color: var(--primary);
					border: none;
					padding: 8px 16px;
					border-radius: 8px;
					font-weight: bold;
					cursor: pointer;
				">Instalar</button>
				<button id="dismiss-button" style="
					background: transparent;
					color: inherit;
					border: 1px solid currentColor;
					padding: 8px 16px;
					border-radius: 8px;
					cursor: pointer;
				">Ahora no</button>
			`;

			document.body.appendChild(banner);

			// Evento de instalación
			document.getElementById('install-button').addEventListener('click', async () => {
				if (deferredPrompt) {
					deferredPrompt.prompt();
					const { outcome } = await deferredPrompt.userChoice;
					console.log(`User response to install prompt: ${outcome}`);
					deferredPrompt = null;
				}
				banner.remove();
			});

			// Evento de dismissal
			document.getElementById('dismiss-button').addEventListener('click', () => {
				localStorage.setItem('pwa-install-dismissed', 'true');
				banner.remove();
			});
		}

		// Detectar cuando la app se instala
		window.addEventListener('appinstalled', () => {
			console.log('✅ PWA instalada correctamente');
			deferredPrompt = null;
		});

		// Animación CSS para el banner
		const style = document.createElement('style');
		style.textContent = `
			@keyframes slideUp {
				from {
					transform: translateX(-50%) translateY(100px);
					opacity: 0;
				}
				to {
					transform: translateX(-50%) translateY(0);
					opacity: 1;
				}
			}
		`;
		document.head.appendChild(style);
	</script>
